<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Record Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            Church Membership System

        </a>

    </div>

</nav>


<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="mb-4">
                        Record Attendance
                    </h3>


                    <form method="POST"
                          action="/attendance">


                        <div class="mb-3">

                            <label class="form-label">
                                Select Member
                            </label>

                            <select name="member_id"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Member
                                </option>


                                {% for member in members %}

                                <option value="{{ member.id }}">

                                    {{ member.full_name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Attendance Date
                            </label>

                            <input type="date"
                                   name="attendance_date"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Service Type
                            </label>

                            <select name="service_type"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Select Service
                                </option>

                                <option value="Sunday Service">
                                    Sunday Service
                                </option>

                                <option value="Midweek Service">
                                    Midweek Service
                                </option>

                                <option value="Special Programme">
                                    Special Programme
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Attendance Status
                            </label>

                            <select name="attendance_status"
                                    class="form-select"
                                    required>

                                <option value="Present">
                                    Present
                                </option>

                                <option value="Absent">
                                    Absent
                                </option>

                            </select>

                        </div>


                        <button type="submit"
                                class="btn btn-primary">

                            Save Attendance

                        </button>


                        <a href="/attendance-history"
                           class="btn btn-secondary">

                            Attendance History

                        </a>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
