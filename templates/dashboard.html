<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Church Membership Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body class="bg-light">


<!-- Navigation -->

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand">
            Church Membership System
        </span>

    </div>

</nav>


<!-- Main Content -->

<div class="container mt-4">


    <h2>
        Dashboard
    </h2>


    <p class="text-muted">
        Living Faith Church, Old Ife Road, Ibadan
    </p>


    <!-- Statistics Cards -->

    <div class="row">


        <!-- Total Members -->

        <div class="col-md-3 mb-3">

            <div class="card shadow">

                <div class="card-body">

                    <h6>
                        Total Members
                    </h6>

                    <h2>
                        {{ total_members }}
                    </h2>

                </div>

            </div>

        </div>


        <!-- Active Members -->

        <div class="col-md-3 mb-3">

            <div class="card shadow">

                <div class="card-body">

                    <h6>
                        Active Members
                    </h6>

                    <h2>
                        {{ active_members }}
                    </h2>

                </div>

            </div>

        </div>


        <!-- New Converts -->

        <div class="col-md-3 mb-3">

            <div class="card shadow">

                <div class="card-body">

                    <h6>
                        New Converts
                    </h6>

                    <h2>
                        0
                    </h2>

                </div>

            </div>

        </div>


        <!-- Attendance -->

        <div class="col-md-3 mb-3">

            <div class="card shadow">

                <div class="card-body">

                    <h6>
                        Attendance
                    </h6>

                    <h2>
                        {{ attendance }}%
                    </h2>

                </div>

            </div>

        </div>


    </div>


    <!-- System Buttons -->

    <div class="mt-4 mb-4">


        <a href="/members"
           class="btn btn-primary me-2 mb-2">

            Members

        </a>


        <a href="/add-member"
           class="btn btn-outline-primary me-2 mb-2">

            Add Member

        </a>


        <a href="/attendance"
           class="btn btn-success me-2 mb-2">

            Record Attendance

        </a>


        <a href="/attendance-history"
           class="btn btn-secondary me-2 mb-2">

            Attendance History

        </a>


    </div>


</div>


</body>

</html>
