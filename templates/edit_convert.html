<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit New Convert</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            Church Membership System

        </a>

    </div>

</nav>


<div class="container mt-4">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="mb-4">
                Edit New Convert
            </h2>


            <form method="POST">


                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           name="full_name"
                           class="form-control"
                           value="{{ convert.full_name }}"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Gender
                    </label>

                    <select name="gender"
                            class="form-select">

                        <option value="">
                            Select Gender
                        </option>

                        <option value="Male"
                            {% if convert.gender == "Male" %}selected{% endif %}>
                            Male
                        </option>

                        <option value="Female"
                            {% if convert.gender == "Female" %}selected{% endif %}>
                            Female
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Age
                    </label>

                    <input type="number"
                           name="age"
                           class="form-control"
                           value="{{ convert.age or '' }}">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input type="text"
                           name="phone"
                           class="form-control"
                           value="{{ convert.phone or '' }}">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Conversion Date
                    </label>

                    <input type="date"
                           name="conversion_date"
                           class="form-control"
                           value="{{ convert.conversion_date }}"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Service Type
                    </label>

                    <input type="text"
                           name="service_type"
                           class="form-control"
                           value="{{ convert.service_type or '' }}">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Follow-up Status
                    </label>

                    <select name="follow_up_status"
                            class="form-select">

                        <option value="Pending"
                            {% if convert.follow_up_status == "Pending" %}selected{% endif %}>
                            Pending
                        </option>

                        <option value="Contacted"
                            {% if convert.follow_up_status == "Contacted" %}selected{% endif %}>
                            Contacted
                        </option>

                        <option value="Visited"
                            {% if convert.follow_up_status == "Visited" %}selected{% endif %}>
                            Visited
                        </option>

                        <option value="Joined"
                            {% if convert.follow_up_status == "Joined" %}selected{% endif %}>
                            Joined
                        </option>

                        <option value="Not Interested"
                            {% if convert.follow_up_status == "Not Interested" %}selected{% endif %}>
                            Not Interested
                        </option>

                    </select>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Department
                    </label>

                    <input type="text"
                           name="department"
                           class="form-control"
                           value="{{ convert.department or '' }}">

                </div>


                <button type="submit"
                        class="btn btn-primary">

                    Save Changes

                </button>


                <a href="/converts"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
