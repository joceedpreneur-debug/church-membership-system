<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register New Convert</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            Church Membership System

        </a>

    </div>

</nav>


<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="mb-4">
                        Register New Convert
                    </h3>


                    <form method="POST"
                          action="/add-convert">


                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   name="full_name"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Gender
                            </label>

                            <select name="gender"
                                    class="form-select">

                                <option value="">
                                    Select Gender
                                </option>

                                <option value="Male">
                                    Male
                                </option>

                                <option value="Female">
                                    Female
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Age
                            </label>

                            <input type="number"
                                   name="age"
                                   class="form-control"
                                   min="1"
                                   max="120">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input type="text"
                                   name="phone"
                                   class="form-control">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Conversion Date
                            </label>

                            <input type="date"
                                   name="conversion_date"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Service Type
                            </label>

                            <select name="service_type"
                                    class="form-select">

                                <option value="">
                                    Select Service
                                </option>

                                <option value="Sunday Service">
                                    Sunday Service
                                </option>

                                <option value="Midweek Service">
                                    Midweek Service
                                </option>

                                <option value="Special Programme">
                                    Special Programme
                                </option>

                                <option value="Evangelism">
                                    Evangelism
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Follow-up Status
                            </label>

                            <select name="follow_up_status"
                                    class="form-select">

                                <option value="Pending">
                                    Pending
                                </option>

                                <option value="Contacted">
                                    Contacted
                                </option>

                                <option value="Follow-up">
                                    Follow-up
                                </option>

                                <option value="Joined Church">
                                    Joined Church
                                </option>

                            </select>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Department
                            </label>

                            <input type="text"
                                   name="department"
                                   class="form-control"
                                   placeholder="Optional">

                        </div>


                        <button type="submit"
                                class="btn btn-success">

                            Save New Convert

                        </button>


                        <a href="/converts"
                           class="btn btn-secondary">

                            View Converts

                        </a>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
