<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Member</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand"
           href="/dashboard">

            Church Membership System

        </a>

    </div>

</nav>


<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="mb-4">
                        Register New Member
                    </h3>


                    <form method="POST"
                          action="/add-member">


                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   name="full_name"
                                   class="form-control"
                                   required>

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Gender
                                </label>

                                <select name="gender"
                                        class="form-select">

                                    <option value="">
                                        Select Gender
                                    </option>

                                    <option value="Male">
                                        Male
                                    </option>

                                    <option value="Female">
                                        Female
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    Age
                                </label>

                                <input type="number"
                                       name="age"
                                       class="form-control">

                            </div>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input type="text"
                                   name="phone"
                                   class="form-control">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Department
                            </label>

                            <select name="department"
                                    class="form-select">

                                <option value="">
                                    Select Department
                                </option>

                                <option value="Choir">
                                    Choir
                                </option>

                                <option value="Protocol">
                                    Protocol
                                </option>

                                <option value="Ushering">
                                    Ushering
                                </option>

                                <option value="Media">
                                    Media
                                </option>

                                <option value="Children">
                                    Children
                                </option>

                                <option value="Evangelism">
                                    Evangelism
                                </option>

                                <option value="Sanctuary">
                                    Sanctuary
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Date Joined
                            </label>

                            <input type="date"
                                   name="date_joined"
                                   class="form-control">

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Membership Status
                            </label>

                            <select name="status"
                                    class="form-select">

                                <option value="Active">
                                    Active
                                </option>

                                <option value="Inactive">
                                    Inactive
                                </option>

                            </select>

                        </div>


                        <button type="submit"
                                class="btn btn-primary">

                            Save Member

                        </button>


                        <a href="/members"
                           class="btn btn-secondary">

                            View Members

                        </a>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
