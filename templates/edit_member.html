<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Member</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a href="/dashboard"
           class="navbar-brand">

            Church Membership System

        </a>

    </div>

</nav>


<div class="container mt-4">


    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="mb-4">
                        Edit Member
                    </h3>


                    <form method="POST"
                          action="/edit-member/{{ member.id }}">


                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   name="full_name"
                                   class="form-control"
                                   value="{{ member.full_name }}"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Gender
                            </label>

                            <select name="gender"
                                    class="form-select">

                                <option value="Male"
                                    {% if member.gender == "Male" %}
                                    selected
                                    {% endif %}>

                                    Male

                                </option>

                                <option value="Female"
                                    {% if member.gender == "Female" %}
                                    selected
                                    {% endif %}>

                                    Female

                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Age
                            </label>

                            <input type="number"
                                   name="age"
                                   class="form-control"
                                   value="{{ member.age }}">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input type="text"
                                   name="phone"
                                   class="form-control"
                                   value="{{ member.phone }}">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Department
                            </label>

                            <input type="text"
                                   name="department"
                                   class="form-control"
                                   value="{{ member.department }}">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Date Joined
                            </label>

                            <input type="date"
                                   name="date_joined"
                                   class="form-control"
                                   value="{{ member.date_joined }}">

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Status
                            </label>

                            <select name="status"
                                    class="form-select">

                                <option value="Active"
                                    {% if member.status == "Active" %}
                                    selected
                                    {% endif %}>

                                    Active

                                </option>

                                <option value="Inactive"
                                    {% if member.status == "Inactive" %}
                                    selected
                                    {% endif %}>

                                    Inactive

                                </option>

                            </select>

                        </div>


                        <button type="submit"
                                class="btn btn-success">

                            Save Changes

                        </button>


                        <a href="/members"
                           class="btn btn-secondary">

                            Cancel

                        </a>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
